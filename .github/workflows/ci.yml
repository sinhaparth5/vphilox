name: CI

on:
  push:
    branches: [master, main]
    # Without this, the release-readiness job below is unreachable: its only
    # guard is a tag ref, and a workflow with no tag trigger never sees one.
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # The one place the formatter version is written down. See the format job.
  CLANG_FORMAT_VERSION: "21.1.8"

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: "linux-gcc",        os: ubuntu-latest,  preset: default }
          - { name: "linux-clang",      os: ubuntu-latest,  preset: default, cxx: clang++ }
          - { name: "linux-debug-werror", os: ubuntu-latest, preset: debug }
          - { name: "linux-scalar",     os: ubuntu-latest,  preset: scalar }
          - { name: "linux-asan",       os: ubuntu-latest,  preset: asan }
          # macOS arm64 is the NEON target -- real hardware, not cross-compiled.
          - { name: "macos-arm64",      os: macos-latest,   preset: default }
          - { name: "windows-msvc",     os: windows-latest, preset: default }

    steps:
      - uses: actions/checkout@v4

      - name: Install Ninja
        uses: seanmiddleditch/gha-setup-ninja@v5

      - name: Set up MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Select compiler
        if: matrix.cxx != ''
        run: echo "CXX=${{ matrix.cxx }}" >> $GITHUB_ENV

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test
        run: ctest --preset ${{ matrix.preset }}

      # The dispatch layer picks a kernel per CPU; log which one so a runner
      # silently falling back to scalar is visible in the CI output rather than
      # hiding behind a green check.
      - name: Report resolved backend
        run: ctest --preset ${{ matrix.preset }} -R Engine.ReportsItsBackend -V

  install:
    name: install + find_package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: seanmiddleditch/gha-setup-ninja@v5

      - name: Build and install
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
                -DVPHILOX_BUILD_TESTS=OFF -DVPHILOX_BUILD_BENCHMARKS=OFF \
                -DVPHILOX_BUILD_TOOLS=OFF
          cmake --build build
          cmake --install build --prefix "$PWD/staging"

      - name: Consume it from a downstream project
        run: |
          mkdir -p /tmp/consumer && cd /tmp/consumer
          cat > CMakeLists.txt <<'CM'
          cmake_minimum_required(VERSION 3.24)
          project(consumer LANGUAGES CXX)
          find_package(vphilox REQUIRED)
          add_executable(app main.cpp)
          target_link_libraries(app PRIVATE vphilox::vphilox)
          CM
          cat > main.cpp <<'CPP'
          #include <cstdio>
          #include <vphilox/vphilox.hpp>
          int main() {
              vphilox::engine g{7};
              std::printf("vphilox %s backend=%s\n", vphilox::version_string,
                          vphilox::backend_name(g.which_backend()));
              return g() == 0 ? 1 : 0;
          }
          CPP
          cmake -B b -G Ninja -DCMAKE_PREFIX_PATH="$GITHUB_WORKSPACE/staging" .
          cmake --build b
          ./b/app

  # Runs only on a tag push. Everything here is a mistake that is expensive to
  # undo once the tag is public and Zenodo has minted a DOI against it, and
  # cheap to catch in the ninety seconds before that happens.
  version-check:
    name: release readiness
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - name: Compare tag against the VERSION file
        run: |
          file_version="$(tr -d '[:space:]' < VERSION)"
          tag_version="${GITHUB_REF_NAME#v}"
          if [ "$file_version" != "$tag_version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match VERSION ($file_version)"
            exit 1
          fi

      # A tag whose changes are still filed under [Unreleased] ships a changelog
      # that describes the previous release. VERSION alone does not catch it:
      # 2026.08.0 sat in VERSION with its own dated section for the whole of
      # Phases 2 through 4, so a tag matching VERSION could still have pointed
      # at a section reading "there is no speedup yet".
      - name: Changelog has a section for this version
        run: |
          version="${GITHUB_REF_NAME#v}"
          if ! grep -qE "^## \[${version}\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [${version}]' section"
            exit 1
          fi
          # Body of [Unreleased], up to the next level-2 heading.
          unreleased="$(awk '/^## \[Unreleased\]/{f=1;next} /^## /{f=0} f' CHANGELOG.md \
                        | grep -v '^[[:space:]]*$' || true)"
          if [ -n "$unreleased" ]; then
            echo "::error::[Unreleased] is not empty; move it under [${version}] before tagging"
            printf '%s\n' "$unreleased" | head -5
            exit 1
          fi

      # The paper is part of what a release archives, and a placeholder that
      # reaches a DOI stays there. \todo renders visibly in the PDF; the
      # affiliation is a red \textcolor rather than a \todo, so grepping for
      # \todo alone misses it.
      - name: Paper has no unfilled placeholders
        run: |
          status=0
          if grep -n '\\todo' paper/vphilox.tex; then
            echo "::error file=paper/vphilox.tex::unresolved \\todo markers"
            status=1
          fi
          if grep -n 'Affiliation: department' paper/vphilox.tex; then
            echo "::error file=paper/vphilox.tex::affiliation placeholder still in the author block"
            status=1
          fi
          exit "$status"

  format:
    name: clang-format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pinned, not the runner's. clang-format is not version-stable: 18 (what
      # ubuntu-24.04 ships) and 21 disagree on a short block following a
      # `#pragma omp`, so an unpinned check enforces whichever version GitHub
      # last baked into the image rather than enforcing .clang-format. The pin
      # tracks what developers run locally; bump it deliberately, in a commit
      # that also reformats whatever the new version changes its mind about.
      - name: Install the pinned clang-format
        run: |
          python3 -m venv /tmp/clang-format-venv
          /tmp/clang-format-venv/bin/pip install --quiet \
            clang-format==${{ env.CLANG_FORMAT_VERSION }}
          echo "/tmp/clang-format-venv/bin" >> "$GITHUB_PATH"

      - name: Check formatting
        run: |
          clang-format --version
          # Vendored code lives one level down inside third_party/ (issue #48)
          # and is skipped: reformatting it would destroy the hashes in
          # benchmarks/third_party/README.md, which are the only thing making
          # its provenance checkable. Files directly in third_party/ are ours
          # and stay checked.
          find include tests benchmarks tools \
            \( -name '*.hpp' -o -name '*.cpp' \) -not -path '*/third_party/*/*' \
            | xargs clang-format --dry-run --Werror

  published-data:
    name: published benchmark data
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check docs/benchmarks/ is current
        run: |
          # The CSVs, SVGs and PDFs under docs/benchmarks/ are generated from
          # the raw JSON in results/, so a run archived without regenerating
          # them leaves published figures that disagree with the data behind
          # them. The script is standard-library only and takes under a second.
          # --check does not look at the PNGs: they are rasterisations of the
          # SVGs it does check, and no two rasterisers agree byte-for-byte.
          python3 scripts/benchmarks/publish_results.py --check

  paper:
    name: paper builds
    runs-on: ubuntu-latest
    # Only when the paper or the figures it pulls in actually changed. A TeX
    # install is minutes of runner time and the other jobs have nothing to do
    # with it.
    steps:
      # Full history: the change check below needs a merge base, which a
      # shallow clone does not have.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Has the paper changed?
        id: changed
        run: |
          # Compare against the PR base, or against the previous commit on a
          # push. If neither is available, build it rather than skip it.
          base="${{ github.event.pull_request.base.sha }}"
          if [ -z "$base" ]; then
            base="$(git rev-parse --verify --quiet HEAD^ || true)"
          fi
          if [ -z "$base" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "no base to compare against; building"
            exit 0
          fi
          if git diff --name-only "$base" HEAD \
               | grep -qE '^(paper/|docs/benchmarks/plots/)'; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "paper untouched; skipping the TeX install"
          fi

      # IEEEtran is in texlive-publishers, algorithm2e in texlive-science, and
      # adjustbox / cleveref / todonotes in texlive-latex-extra. Naming them
      # rather than installing texlive-full keeps this to a few minutes.
      - name: Install TeX
        if: steps.changed.outputs.build == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-base texlive-latex-recommended texlive-latex-extra \
            texlive-publishers texlive-science texlive-fonts-recommended

      # --strict, because the paper's quality bar is zero overfull boxes and
      # zero undefined references, and a draft that quietly loses a \cref
      # target is worse than one that fails here.
      - name: Build the paper
        if: steps.changed.outputs.build == 'true'
        run: paper/build.sh --strict

      # The tracked paper/vphilox.pdf can go stale, because nothing forces a
      # rebuild when the source changes and most contributors have no TeX
      # install. This artifact is the current PDF regardless.
      - name: Upload the built PDF
        if: steps.changed.outputs.build == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: vphilox-paper
          path: paper/vphilox.pdf

      # Not an error: the tracked PDF is a convenience copy for readers with no
      # TeX install, and two TeX distributions do not agree byte for byte, so
      # comparing this build against the tracked file would warn on every run
      # and mean nothing. Comparing commit times does mean something -- it says
      # the source was committed after the PDF was, which is exactly staleness.
      - name: Note whether the tracked PDF is behind the source
        run: |
          tex="$(git log -1 --format=%ct -- paper/vphilox.tex)"
          pdf="$(git log -1 --format=%ct -- paper/vphilox.pdf)"
          if [ -n "$tex" ] && [ -n "$pdf" ] && [ "$tex" -gt "$pdf" ]; then
            echo "::warning file=paper/vphilox.pdf::vphilox.tex was committed after vphilox.pdf, so the tracked PDF is behind the source. Run paper/build.sh and commit it, or download the vphilox-paper artifact from this run."
          else
            echo "tracked PDF is no older than the source"
          fi

  # TODO(phase-4): a scheduled job running PractRand for a few hours on the
  # nightly build. Too slow for per-PR CI, but a regression in the statistical
  # properties needs to be caught by something.
