<svg xmlns="http://www.w3.org/2000/svg" width="980" height="520" viewBox="0 0 980 520" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-variant-numeric="tabular-nums" role="img" aria-label="Thread scaling on the Raspberry Pi 5">
<title>Thread scaling on the Raspberry Pi 5</title>
<rect width="980" height="520" fill="#FFFFFF"/>
<text x="32" y="28" font-size="17" fill="#16191D" font-weight="600">Aggregate cost per byte against thread count — Pi 5, 4 cores</text>
<text x="32" y="48" font-size="12" fill="#454B54">Flat means linear scaling: twice the threads, twice the output, same cost per byte. Two visible lines rather than four — each working set lands on the other, which is</text>
<text x="32" y="65" font-size="12" fill="#454B54">the result. Past four threads the cores are oversubscribed.</text>
