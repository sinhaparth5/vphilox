<text x="679" y="96" font-size="12" text-anchor="start" fill="#222222" font-weight="normal">buffered, 256 KiB</text>
<rect x="664" y="106" width="9" height="9" fill="#c0504d" fill-opacity="1"/>
<text x="679" y="115" font-size="12" text-anchor="start" fill="#222222" font-weight="normal">generate_n, 256 KiB</text>
<rect x="664" y="125" width="9" height="9" fill="#3f8f4f" fill-opacity="1"/>
<text x="679" y="134" font-size="12" text-anchor="start" fill="#222222" font-weight="normal">buffered, 4 MiB</text>
<rect x="664" y="144" width="9" height="9" fill="#8064a2" fill-opacity="1"/>
