<circle cx="92" cy="210.25" r="3" fill="#c0504d"/>
<circle cx="198.8" cy="210.27" r="3" fill="#c0504d"/>
<circle cx="305.6" cy="210.26" r="3" fill="#c0504d"/>
<circle cx="412.4" cy="210.24" r="3" fill="#c0504d"/>
<circle cx="519.2" cy="210.25" r="3" fill="#c0504d"/>
<circle cx="626" cy="210.24" r="3" fill="#c0504d"/>
<polyline points="92,162.07 198.8,162 305.6,161.78 412.4,161.72 519.2,161.71 626,161.72" fill="none" stroke="#3f8f4f" stroke-width="2" stroke-linejoin="round" stroke-dasharray="6 4"/>
<circle cx="92" cy="162.07" r="3" fill="#3f8f4f"/>
<circle cx="198.8" cy="162" r="3" fill="#3f8f4f"/>
<circle cx="305.6" cy="161.78" r="3" fill="#3f8f4f"/>
<circle cx="412.4" cy="161.72" r="3" fill="#3f8f4f"/>
<circle cx="519.2" cy="161.71" r="3" fill="#3f8f4f"/>
<circle cx="626" cy="161.72" r="3" fill="#3f8f4f"/>
