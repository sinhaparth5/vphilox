<svg xmlns="http://www.w3.org/2000/svg" width="980" height="554" viewBox="0 0 980 554" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-variant-numeric="tabular-nums" role="img" aria-label="Where the scaling knee comes from">
<title>Where the scaling knee comes from</title>
<rect width="980" height="554" fill="#FFFFFF"/>
<text x="32" y="28" font-size="17" fill="#16191D" font-weight="600">Thread placement, not thread count — Cascade Lake, 2 sockets, 16 cores</text>
<text x="32" y="48" font-size="12" fill="#454B54">generate_n, aggregate cost per byte. One thread per physical core stays flat all the way to sixteen; putting the same sixteen workers on eight cores' hyperthread</text>
<text x="32" y="65" font-size="12" fill="#454B54">siblings costs about 35% each. Dashed lines are the 4 MiB working set.</text>
