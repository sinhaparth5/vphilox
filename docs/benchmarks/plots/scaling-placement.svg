<text x="671" y="96" font-size="12" text-anchor="start" fill="#222222" font-weight="normal">1/core, 2 sockets — 256 KiB</text>
<rect x="656" y="106" width="9" height="9" fill="#c0504d" fill-opacity="1"/>
<text x="671" y="115" font-size="12" text-anchor="start" fill="#222222" font-weight="normal">1/core, 2 sockets — 4 MiB</text>
