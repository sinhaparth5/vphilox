<text x="70" y="166.5" font-size="11" text-anchor="end" fill="#555555" font-weight="normal">0.9</text>
<line x1="78" y1="136.33" x2="632" y2="136.33" stroke="#d8d8d8" stroke-width="1"/>
<text x="70" y="140.33" font-size="11" text-anchor="end" fill="#555555" font-weight="normal">1</text>
<line x1="78" y1="110.17" x2="632" y2="110.17" stroke="#d8d8d8" stroke-width="1"/>
<text x="70" y="114.17" font-size="11" text-anchor="end" fill="#555555" font-weight="normal">1.1</text>
<line x1="78" y1="84" x2="632" y2="84" stroke="#d8d8d8" stroke-width="1"/>
<text x="70" y="88" font-size="11" text-anchor="end" fill="#555555" font-weight="normal">1.2</text>
<text x="20" y="70" font-size="11" text-anchor="start" fill="#555555" font-weight="normal">cycles/byte</text>
<text x="94" y="420" font-size="11" text-anchor="middle" fill="#555555" font-weight="normal">1</text>
<text x="224.5" y="420" font-size="11" text-anchor="middle" fill="#555555" font-weight="normal">2</text>
<text x="355" y="420" font-size="11" text-anchor="middle" fill="#555555" font-weight="normal">4</text>
<text x="485.5" y="420" font-size="11" text-anchor="middle" fill="#555555" font-weight="normal">8</text>
<text x="616" y="420" font-size="11" text-anchor="middle" fill="#555555" font-weight="normal">16</text>
<text x="355" y="442" font-size="12" text-anchor="middle" fill="#222222" font-weight="normal">threads</text>
<line x1="78" y1="273.72" x2="632" y2="273.72" stroke="#999999" stroke-width="1.2" stroke-dasharray="4 3"/>
<text x="84" y="267.72" font-size="10" text-anchor="start" fill="#777777" font-weight="normal">single thread, 0.475</text>
