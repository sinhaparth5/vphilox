<text x="70" y="271.17" font-size="11" text-anchor="end" fill="#555555" font-weight="normal">0.5</text>
<line x1="78" y1="241" x2="632" y2="241" stroke="#d8d8d8" stroke-width="1"/>
<text x="70" y="245" font-size="11" text-anchor="end" fill="#555555" font-weight="normal">0.6</text>
<line x1="78" y1="214.83" x2="632" y2="214.83" stroke="#d8d8d8" stroke-width="1"/>
<text x="70" y="218.83" font-size="11" text-anchor="end" fill="#555555" font-weight="normal">0.7</text>
