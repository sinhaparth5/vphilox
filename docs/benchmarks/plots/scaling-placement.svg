<svg xmlns="http://www.w3.org/2000/svg" width="900" height="460" viewBox="0 0 900 460" font-family="DejaVu Sans, Verdana, sans-serif">
<title>Where the scaling knee comes from</title>
<rect width="900" height="460" fill="#ffffff"/>
<text x="18" y="28" font-size="15" text-anchor="start" fill="#222222" font-weight="bold">Thread placement, not thread count — Cascade Lake, 2 sockets, 16 cores</text>
<text x="18" y="48" font-size="11" text-anchor="start" fill="#555555" font-weight="normal">generate_n, aggregate cost per byte. Flat is linear scaling. One thread per physical core stays flat to 16; sharing a core costs ~35%.</text>
