<svg xmlns="http://www.w3.org/2000/svg" width="980" height="890" viewBox="0 0 980 890" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-variant-numeric="tabular-nums" role="img" aria-label="Throughput relative to std::mt19937">
<title>Throughput relative to std::mt19937</title>
<rect width="980" height="890" fill="#FFFFFF"/>
<text x="32" y="28" font-size="17" fill="#16191D" font-weight="600">Cost per byte, relative to std::mt19937 on the same machine</text>
<text x="32" y="48" font-size="12" fill="#454B54">Lower is faster. Every bar is a ratio measured inside one machine, never a raw cycles/byte: RDTSC counts reference cycles, so the absolute unit does not carry</text>
<text x="32" y="65" font-size="12" fill="#454B54">across hosts. The dashed rule is std::mt19937 itself.</text>
