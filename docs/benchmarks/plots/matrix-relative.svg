<svg xmlns="http://www.w3.org/2000/svg" width="900" height="661" viewBox="0 0 900 661" font-family="DejaVu Sans, Verdana, sans-serif">
<title>Throughput relative to std::mt19937</title>
<rect width="900" height="661" fill="#ffffff"/>
<text x="20" y="28" font-size="15" text-anchor="start" fill="#222222" font-weight="bold">Cost per byte, relative to std::mt19937 on the same machine</text>
<text x="20" y="48" font-size="11" text-anchor="start" fill="#555555" font-weight="normal">Lower is faster. Ratios, not cycles/byte: the absolute unit does not compare across machines.</text>
<line x1="210" y1="70" x2="210" y2="558" stroke="#d8d8d8" stroke-width="1"/>
<text x="210" y="574" font-size="11" text-anchor="middle" fill="#555555" font-weight="normal">0x</text>
<line x1="367.5" y1="70" x2="367.5" y2="558" stroke="#d8d8d8" stroke-width="1"/>
<text x="367.5" y="574" font-size="11" text-anchor="middle" fill="#555555" font-weight="normal">0.5x</text>
<line x1="525" y1="70" x2="525" y2="558" stroke="#d8d8d8" stroke-width="1"/>
<text x="525" y="574" font-size="11" text-anchor="middle" fill="#555555" font-weight="normal">1x</text>
<line x1="682.5" y1="70" x2="682.5" y2="558" stroke="#d8d8d8" stroke-width="1"/>
<text x="682.5" y="574" font-size="11" text-anchor="middle" fill="#555555" font-weight="normal">1.5x</text>
<line x1="840" y1="70" x2="840" y2="558" stroke="#d8d8d8" stroke-width="1"/>
<text x="840" y="574" font-size="11" text-anchor="middle" fill="#555555" font-weight="normal">2x</text>
<line x1="525" y1="70" x2="525" y2="558" stroke="#999999" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="200" y="88" font-size="12" text-anchor="end" fill="#222222" font-weight="bold">xoshiro256++</text>
<rect x="210" y="78" width="88.49" height="15" fill="#1f4e79" fill-opacity="1"/>
<text x="304.49" y="88" font-size="10" text-anchor="start" fill="#555555" font-weight="normal">0.28x</text>
<rect x="210" y="98" width="93.55" height="15" fill="#c0504d" fill-opacity="1"/>
<text x="309.55" y="108" font-size="10" text-anchor="start" fill="#555555" font-weight="normal">0.30x</text>
<rect x="210" y="118" width="76.04" height="15" fill="#3f8f4f" fill-opacity="1"/>
<text x="292.04" y="128" font-size="10" text-anchor="start" fill="#555555" font-weight="normal">0.24x</text>
