<text x="32" y="28" font-size="17" fill="#16191D" font-weight="600">Float conversion cost against working set — Sapphire Rapids</text>
<text x="32" y="48" font-size="12" fill="#454B54">Both axes are logarithmic. The three widths separate at 16 KiB and again at 32 MiB, and converge at the 512 KiB row where the loop is bandwidth-bound rather</text>
