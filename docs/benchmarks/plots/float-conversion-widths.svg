<svg xmlns="http://www.w3.org/2000/svg" width="880" height="440" viewBox="0 0 880 440" font-family="DejaVu Sans, Verdana, sans-serif">
<title>Float conversion width against working set</title>
<rect width="880" height="440" fill="#ffffff"/>
