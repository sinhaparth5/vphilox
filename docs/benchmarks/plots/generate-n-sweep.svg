<text x="18" y="28" font-size="15" text-anchor="start" fill="#222222" font-weight="bold">What a small generate_n call costs, relative to the bulk path</text>
<text x="18" y="48" font-size="11" text-anchor="start" fill="#555555" font-weight="normal">1.0x is the raw kernel. Ratios within each machine, so the curves are comparable even though the cycles are not.</text>
